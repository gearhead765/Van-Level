# File: /config/packages/van_leveling.yaml

rest:
  - resource: http://YOUR_IP_HERE/readings
    method: GET
    scan_interval: 1
    sensor:
      - name: "Van Level Data"
        unique_id: van_level_data
        value_template: "{{ value_json.pitch }}"  # required, even if we only use attributes
        unit_of_measurement: "°"
        # Prevents UI flickering if a network packet drops
        availability: "{{ value_json is defined and value_json.pitch is defined }}"
        json_attributes:
          - pitch
          - roll
          - ver
          - fraction
          - lvl
          - lf
          - rf
          - lr
          - rr
          - vanType
          - wheelbase
          - track

template:
  - binary_sensor:
      - name: "Van OK Level"
        unique_id: van_ok_level
        state: "{{ state_attr('sensor.van_level_data', 'lvl') | bool(false) }}"
        
  # Sensors for pitch, roll, and calculations
  - sensor:
      # dummy sensor to allow placing text on lovelace picture cards
      - name: "Van Level Text"
        unique_id: van_level_text
        state: " "

      - name: "Van Level Version"
        unique_id: van_level_version
        state: "{{ state_attr('sensor.van_level_data', 'ver') | default('Unknown') }}"

      - name: "Van Level Van Type"
        unique_id: van_level_van_type
        state: "{{ state_attr('sensor.van_level_data', 'vanType') | default('Unknown') }}"

      - name: "Van Level Wheelbase"
        unique_id: van_level_wheelbase
        unit_of_measurement: '"'
        state: "{{ state_attr('sensor.van_level_data', 'wheelbase') | float(0) }}"

      - name: "Van Level Track"
        unique_id: van_level_track
        unit_of_measurement: '"'
        state: "{{ state_attr('sensor.van_level_data', 'track') | float(0) }}"

      - name: "Van Level Pitch"
        unique_id: van_level_pitch
        unit_of_measurement: "°"
        state: "{{ state_attr('sensor.van_level_data', 'pitch') | float(0) | round(1) }}"

      - name: "Van Level Roll"
        unique_id: van_level_roll
        unit_of_measurement: "°"
        state: "{{ state_attr('sensor.van_level_data', 'roll') | float(0) | round(1) }}"

      # Heights are calculated by the ESP32; a wheel reading 0.0 is hidden by the Lovelace card
      - name: "Van Level Left Front Lift"
        unique_id: van_level_left_front_lift
        unit_of_measurement: '"'
        state: "{{ state_attr('sensor.van_level_data', 'lf') | float(0) }}"

      - name: "Van Level Right Front Lift"
        unique_id: van_level_right_front_lift
        unit_of_measurement: '"'
        state: "{{ state_attr('sensor.van_level_data', 'rf') | float(0) }}"

      - name: "Van Level Right Rear Lift"
        unique_id: van_level_right_rear_lift
        unit_of_measurement: '"'
        state: "{{ state_attr('sensor.van_level_data', 'rr') | float(0) }}"

      - name: "Van Level Left Rear Lift"
        unique_id: van_level_left_rear_lift
        unit_of_measurement: '"'
        state: "{{ state_attr('sensor.van_level_data', 'lr') | float(0) }}"
